[project]
name = "rehabify-voice-gateway"
version = "0.1.0"
description = "Rehabify voice gateway — browser WSS in, Deepgram WSS out, turn loop in the middle."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

# Deliberately absent, and the absence is load-bearing:
#   - no asyncpg / psycopg / sqlalchemy / supabase — ADR-016: this service holds
#     no database connection and no database credentials, ever.
#   - no langchain / langgraph — ADR-016: code routes, the model only phrases.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
voice-gateway = "voice_gateway.__main__:main"
prerender-questions = "voice_gateway.audio.prerender:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:voice_gateway.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
